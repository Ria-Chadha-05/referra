services:
  - type: web
    name: referra-api
    runtime: python
    rootDir: backend   # tells Render your backend code lives in the /backend folder
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

      # ── Set all of these manually in the Render dashboard ─────────────────
      # (Dashboard → your service → Environment → Add Environment Variable)
      # Never put real secrets in this file.

      - key: DATABASE_URL
        sync: false   # e.g. postgresql://neondb_owner:...@.../neondb?sslmode=require

      - key: SECRET_KEY
        sync: false   # e.g. 68019cc7d5849d...  (keep it secret)

      - key: GROQ_API_KEY
        sync: false   # e.g. gsk_KWcmI3h...

      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false   # leave blank value in dashboard if you don't have one

      - key: CORS_ORIGINS
        sync: false   # set to: ["https://YOUR-APP.vercel.app"]
                      # Replace YOUR-APP with your actual Vercel project URL.
                      # Example: ["https://referra.vercel.app"]

      # ── AI pipeline settings (safe to hardcode, not secret) ───────────────
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      - key: LLM_MODEL
        value: llama3-70b-8192

      - key: MAX_PAPERS_PER_CLAIM
        value: 10

      - key: TOP_REFS_TO_RETURN
        value: 3

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
